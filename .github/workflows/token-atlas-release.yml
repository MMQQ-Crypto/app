name: Token Atlas Windows Release
on:
  push:
    branches: [main]
    paths:
      - 'token-atlas/**'
      - '.github/workflows/token-atlas-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: token-atlas-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: token-atlas
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
          node node_modules/electron/install.js
      - name: Test
        run: pnpm test
      - name: Build Windows portable application
        run: pnpm exec electron-builder --win portable --x64 --publish never
      - name: Prepare update manifest and extension
        run: |
          node scripts/make-release.cjs
          Compress-Archive -Path extension/* -DestinationPath release/Token-Atlas-browser-extension.zip -Force
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: token-atlas-windows
          path: |
            token-atlas/release/Token-Atlas-*-Windows-x64.exe
            token-atlas/release/token-atlas-update.json
            token-atlas/release/SHA256.txt
            token-atlas/release/Token-Atlas-browser-extension.zip
          if-no-files-found: error
      - name: Publish Token Atlas release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "token-atlas-v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Version already published; existing assets are preserved."; exit 0 }
          gh release create $tag "release/Token-Atlas-$version-Windows-x64.exe" release/token-atlas-update.json release/SHA256.txt release/Token-Atlas-browser-extension.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Token Atlas $version" --notes-file RELEASE_NOTES.md --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
